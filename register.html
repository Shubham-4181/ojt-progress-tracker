<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Register</title>

  <link
    rel="stylesheet"
    href="style.css"
  >

</head>

<body>

  <div class="container">

    <h1>Student Register</h1>

    <form id="registerForm">

      <input
        type="text"
        id="name"
        placeholder="Enter Name"
        required
      >

      <input
        type="email"
        id="email"
        placeholder="Enter Email"
        required
      >

      <input
        type="password"
        id="password"
        placeholder="Enter Password"
        required
      >

      <button type="submit">

        Register

      </button>

      <p class="link-text">

  Already have an account?

  <a href="login.html">

    Login Here

  </a>

</p>

    </form>

  </div>

  <script>

    const registerForm =
      document.getElementById(
        "registerForm"
      );

    registerForm.addEventListener(

      "submit",

      async function(e){

        e.preventDefault();

        const name =
          document.getElementById(
            "name"
          ).value;

        const email =
          document.getElementById(
            "email"
          ).value;

        const password =
          document.getElementById(
            "password"
          ).value;

        const res =
          await fetch(

            "http://localhost:8080/register",

            {

              method: "POST",

              headers: {

                "Content-Type":
                  "application/json"

              },

              body: JSON.stringify({

                name,
                email,
                password

              })

            }

          );

        const data =
          await res.json();

        alert(data.message);

        registerForm.reset();

window.location.href =
  "index.html";

      }

    );

  </script>

</body>

</html>
