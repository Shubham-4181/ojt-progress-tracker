<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>OJT Progress Tracker</title>

  <link rel="stylesheet" href="style.css">

</head>

<body>

  <div class="container">

    <h1>OJT Progress Tracker</h1>

    <h2 id="studentName"></h2>

  <div class="top-buttons">

  <button id="backToAdmin">

    Back To Admin Dashboard

  </button>

  <button id="logoutBtn">

    Logout

  </button>

</div>

    <form id="taskForm">

      <input
        type="text"
        id="title"
        placeholder="Task Title"
        required
      >

      <input
        type="text"
        id="category"
        placeholder="Category"
        required
      >

      <input
        type="date"
        id="date"
        required
      >

      <select id="status">

        <option value="Pending">
          Pending
        </option>

        <option value="In Progress">
          In Progress
        </option>

        <option value="Completed">
          Completed
        </option>

      </select>

      <button type="submit">
        Add Task
      </button>

    </form>

    <div id="summary"></div>

    <div id="streak"></div>

    <div id="taskList"></div>

    <div class="notes">

      <h2>Daily Notes</h2>

      <textarea
        id="notes"
        placeholder="Write errors, learnings and mentor feedback..."
      ></textarea>

    </div>

  </div>

  <script src="script.js"></script>

</body>

</html>
