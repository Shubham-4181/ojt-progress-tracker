<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Login</title>

  <link
    rel="stylesheet"
    href="style.css"
  >

</head>

<body>

  <div class="container">

    <h1>Login</h1>

    <form id="loginForm">

      <input
        type="email"
        id="email"
        placeholder="Enter Email"
        required
      >

      <input
        type="password"
        id="password"
        placeholder="Enter Password"
        required
      >

      <button type="submit">

        Login

      </button>

      <p class="link-text">

  New Student?

  <a href="register.html">

    Register Here

  </a>

</p>

    </form>

  </div>

  <script>

    const loginForm =
      document.getElementById(
        "loginForm"
      );

    loginForm.addEventListener(

      "submit",

      async function(e){

        e.preventDefault();

        const email =
          document.getElementById(
            "email"
          ).value;

        const password =
          document.getElementById(
            "password"
          ).value;

        const res =
          await fetch(

            "http://localhost:8080/login",

            {

              method: "POST",

              headers: {

                "Content-Type":
                  "application/json"

              },

              body: JSON.stringify({

                email,
                password

              })

            }

          );

        const data =
          await res.json();


if(data.message === "Login Success"){

  localStorage.removeItem(
    "adminViewMode"
  );

  localStorage.removeItem(
    "viewStudentId"
  );

  localStorage.setItem(
    "userId",
    data.userId
  );

  if(data.role === "admin"){

    window.location.href =
      "admin.html";

  }

  else{

    window.location.href =
      "index.html";

  }

}

      }

    );

  </script>

</body>

</html>
